[project]
name = "llm-basics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "chillydusk", email = "mjh050728@163.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-openai>=1.7.2",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
llm-basics = "llm_basics:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]
